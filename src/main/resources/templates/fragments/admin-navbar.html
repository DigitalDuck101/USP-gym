<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>


<nav th:fragment="adminNavbar"
     class="navbar navbar-expand-lg navbar-dark bg-dark">


    <div class="container">


        <!-- BRAND -->

        <a class="navbar-brand"
           th:href="@{/dashboard}">

            USP Fitness Club

        </a>



        <!-- MOBILE BUTTON -->

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#adminNavbar">

            <span class="navbar-toggler-icon">
            </span>

        </button>



        <!-- NAVBAR -->

        <div class="collapse navbar-collapse"
             id="adminNavbar">


            <!-- LEFT SIDE -->

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/members}">

                        Members

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/trainers}">

                        Trainers

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/fitness-classes}">

                        Fitness Classes

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/admin/student-approvals}">

                        Student Approvals

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/admin/facilities}">

                        Sports Facilities

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/admin/rentals}">

                        Facility Rentals

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/admin/admins}">

                        Administrators

                    </a>

                </li>


            </ul>



            <!-- RIGHT SIDE -->

            <div class="d-flex
                        align-items-center
                        gap-3">


                <!-- CURRENT USER -->

                <span class="navbar-text text-light">

                    Logged in as:

                    <strong sec:authentication="name">

                        username

                    </strong>

                </span>



                <!-- LOGOUT -->

                <form th:action="@{/logout}"
                      method="post"
                      class="m-0">


                    <button type="submit"
                            class="btn btn-outline-light btn-sm">

                        Logout

                    </button>


                </form>


            </div>


        </div>


    </div>


</nav>


</body>

</html>
