<body>

<nav th:fragment="adminNavbar"

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/members}">
            USP Fitness Club
        </a>


        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#adminNavbar">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse"
             id="adminNavbar">


            <ul class="navbar-nav me-auto mb-2 mb-lg-0">


                <li class="nav-item">

                    <a class="nav-link"

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/admin/facilities}">
                        Sports Facilities
                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/admin/rentals}">
                        Facility Rentals
                    </a>

                </li>


            </ul>


            <form th:action="@{/logout}"
                  method="post"
                  class="d-flex">

                <button type="submit"
                        class="btn btn-outline-light">

                    Logout
