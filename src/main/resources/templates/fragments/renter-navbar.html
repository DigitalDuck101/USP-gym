<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>


<nav th:fragment="renterNavbar"
     class="navbar navbar-expand-lg navbar-dark bg-dark">


    <div class="container">


        <a class="navbar-brand"
           th:href="@{/profile}">

            USP Fitness Club

        </a>



        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#renterNavbar">

            <span class="navbar-toggler-icon">
            </span>

        </button>



        <div class="collapse navbar-collapse"
             id="renterNavbar">


            <!-- LEFT -->

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/profile}">

                        Profile

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/member/classes}">

                        Fitness Classes

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/member/bookings}">

                        My Bookings

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/renter/rentals}">

                        Facility Rentals

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/renter/rental-request/new}">

                        Request Rental

                    </a>

                </li>


            </ul>



            <!-- RIGHT -->

            <div class="d-flex
                        align-items-center
                        gap-3">


                <span class="navbar-text text-light">

                    Logged in as:

                    <strong sec:authentication="name">

                        username

                    </strong>

                </span>



                <form th:action="@{/logout}"
                      method="post"
                      class="m-0">


                    <button type="submit"
                            class="btn btn-outline-light btn-sm">

                        Logout

                    </button>


                </form>


            </div>


        </div>


    </div>


</nav>


</body>

</html>
