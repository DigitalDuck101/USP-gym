<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">


    <title>Edit Member - USP Fitness Club</title>


    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

</head>


<body>


<div th:replace="~{fragments/admin-navbar :: adminNavbar}">
</div>


<div class="container page-container">


    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">


            <div class="mb-4">

                <h1 class="page-title">
                    Edit Member
                </h1>

                <p class="text-muted">
                    Update member information
                </p>

            </div>



            <div class="card shadow-sm">

                <div class="card-body p-4">


                    <form th:action="@{/members/update/{id}
                                     (id=${member.id})}"
                          th:object="${member}"
                          method="post">


                        <!-- MEMBER TYPE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Member Type
                            </label>


                            <input type="text"
                                   class="form-control"
                                   th:value="${member.memberType}"
                                   disabled>


                        </div>



                        <!-- STUDENT ID ONLY FOR STUDENT -->

                        <div class="mb-3"
                             th:if="${member.memberType != null
                             and member.memberType.name() == 'STUDENT'}">


                            <label class="form-label">
                                Student ID
                            </label>


                            <input type="text"
                                   th:field="*{studentId}"
                                   class="form-control"
                                   required>

                        </div>



                        <!-- FOR RENTER -->

                        <div class="alert alert-info"
                             th:if="${member.memberType != null
                             and member.memberType.name() == 'RENTER'}">

                            This member is registered as a renter.
                            Student ID is not required.

                        </div>



                        <hr class="my-4">


                        <!-- FIRST NAME -->

                        <div class="mb-3">

                            <label class="form-label">
                                First Name
                            </label>


                            <input type="text"
                                   th:field="*{firstName}"
                                   class="form-control"
                                   required>

                        </div>



                        <!-- LAST NAME -->

                        <div class="mb-3">

                            <label class="form-label">
                                Last Name
                            </label>


                            <input type="text"
                                   th:field="*{lastName}"
                                   class="form-control"
                                   required>

                        </div>



                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>


                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   required>

                        </div>



                        <!-- PHONE -->

                        <div class="mb-4">

                            <label class="form-label">
                                Phone
                            </label>


                            <input type="text"
                                   th:field="*{phone}"
                                   class="form-control">

                        </div>



                        <div class="d-flex gap-2">


                            <button type="submit"
                                    class="btn btn-primary">

                                Save Changes

                            </button>


                            <a th:href="@{/members}"
                               class="btn btn-outline-secondary">

                                Cancel

                            </a>


                        </div>


                    </form>


                </div>

            </div>


        </div>

    </div>


</div>


<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}">
</script>


</body>

</html>
