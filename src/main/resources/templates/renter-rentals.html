<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>My Facility Rentals - USP Fitness Club</title>


    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">


    <link rel="stylesheet"
          th:href="@{/css/app.css}">

</head>


<body>


<div th:replace="~{fragments/renter-navbar :: renterNavbar}">
</div>


<div class="container page-container">


    <!-- HEADER -->

    <div class="d-flex
                justify-content-between
                align-items-center
                mb-4">


        <div>

            <h1 class="page-title">
                My Facility Rentals
            </h1>

            <p class="text-muted mb-0">
                View your requests and confirmed facility rentals
            </p>

        </div>


        <a th:href="@{/renter/rental-request/new}"
           class="btn btn-primary">

            + Request Rental

        </a>


    </div>



    <!-- SUCCESS -->

    <div th:if="${successMessage}"
         class="alert alert-success
                alert-dismissible fade show">

        <span th:text="${successMessage}">
        </span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>



    <!-- ERROR -->

    <div th:if="${errorMessage}"
         class="alert alert-danger
                alert-dismissible fade show">

        <span th:text="${errorMessage}">
        </span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>



    <div class="card shadow-sm">

        <div class="card-body">


            <div th:if="${!#lists.isEmpty(rentals)}"
                 class="table-responsive">


                <table class="table
                              table-striped
                              table-hover
                              align-middle">


                    <thead class="table-dark">


                    <tr>

                        <th>Facility</th>

                        <th>Type</th>

                        <th>Location</th>

                        <th>From</th>

                        <th>To</th>

                        <th>Purpose</th>

                        <th>Status</th>

                        <th>Admin Comment</th>

                    </tr>


                    </thead>



                    <tbody>


                    <tr th:each="rental : ${rentals}">


                        <!-- FACILITY -->

                        <td>

                            <strong th:text="${rental.facility.name}">
                            </strong>

                        </td>



                        <!-- TYPE -->

                        <td>

                            <span class="badge text-bg-info"
                                  th:text="${rental.facility.type}">
                            </span>

                        </td>



                        <!-- LOCATION -->

                        <td th:text="${rental.facility.location}">
                        </td>



                        <!-- START -->

                        <td th:text="${rental.startDateTime}">
                        </td>



                        <!-- END -->

                        <td th:text="${rental.endDateTime}">
                        </td>



                        <!-- PURPOSE -->

                        <td th:text="${rental.purpose}">
                        </td>



                        <!-- STATUS -->

                        <td>


                            <span th:if="${rental.status.name() == 'PENDING'}"
                                  class="badge text-bg-warning">

                                PENDING

                            </span>


                            <span th:if="${rental.status.name() == 'CONFIRMED'}"
                                  class="badge text-bg-success">

                                CONFIRMED

                            </span>


                            <span th:if="${rental.status.name() == 'REJECTED'}"
                                  class="badge text-bg-danger">

                                REJECTED

                            </span>


                            <span th:if="${rental.status.name() == 'CANCELLED'}"
                                  class="badge text-bg-secondary">

                                CANCELLED

                            </span>


                        </td>



                        <!-- ADMIN COMMENT -->

                        <td>


                            <span th:if="${rental.adminComment != null
                                         and !rental.adminComment.isEmpty()}"
                                  th:text="${rental.adminComment}">
                            </span>


                            <span th:unless="${rental.adminComment != null
                                             and !rental.adminComment.isEmpty()}"
                                  class="text-muted">

                                —

                            </span>


                        </td>


                    </tr>


                    </tbody>


                </table>


            </div>



            <!-- EMPTY -->

            <div th:if="${#lists.isEmpty(rentals)}"
                 class="text-center text-muted p-5">


                <h5>
                    No facility rentals yet
                </h5>


                <p>
                    You have not submitted any facility rental requests.
                </p>


                <a th:href="@{/renter/rental-request/new}"
                   class="btn btn-primary">

                    Request Facility Rental

                </a>


            </div>


        </div>

    </div>


</div>


<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}">
</script>


</body>
</html>
