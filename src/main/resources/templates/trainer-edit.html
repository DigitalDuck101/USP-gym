<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Edit Trainer - USP Fitness Club</title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

</head>

<body>


<div th:replace="~{fragments/admin-navbar :: adminNavbar}">
</div>


<div class="container page-container">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">


            <div class="mb-4">

                <h1 class="page-title">
                    Edit Trainer
                </h1>

                <p class="text-muted">
                    Update trainer information
                </p>

            </div>


            <div class="card shadow-sm">

                <div class="card-body p-4">


                    <form th:action="@{/trainers/update/{id}
                                     (id=${trainer.id})}"
                          th:object="${trainer}"
                          method="post">


                        <!-- STAFF ID -->

                        <div class="mb-3">

                            <label class="form-label">
                                Staff ID
                            </label>

                            <input type="text"
                                   th:field="*{staffId}"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- FIRST NAME -->

                        <div class="mb-3">

                            <label class="form-label">
                                First Name
                            </label>

                            <input type="text"
                                   th:field="*{firstName}"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- LAST NAME -->

                        <div class="mb-3">

                            <label class="form-label">
                                Last Name
                            </label>

                            <input type="text"
                                   th:field="*{lastName}"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- PHONE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Phone
                            </label>

                            <input type="text"
                                   th:field="*{phone}"
                                   class="form-control">

                        </div>


                        <!-- SPECIALIZATION -->

                        <div class="mb-4">

                            <label class="form-label">
                                Specialization
                            </label>

                            <input type="text"
                                   th:field="*{specialization}"
                                   class="form-control"
                                   required>

                        </div>


                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-primary">

                                Save Changes

                            </button>


                            <a th:href="@{/trainers}"
                               class="btn btn-outline-secondary">

                                Cancel

                            </a>

                        </div>


                    </form>


                </div>

            </div>


        </div>

    </div>

</div>


<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}">
</script>

</body>

</html>
