<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Create Facility Block-Out - USP Fitness Centre</title>


    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

</head>


<body>


<!-- ADMIN NAVBAR -->
<div th:replace="~{fragments/admin-navbar :: adminNavbar}">
</div>


<div class="container page-container">


    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">


            <!-- HEADER -->
            <div class="mb-4">

                <h1 class="page-title">
                    Create Facility Block-Out
                </h1>

                <p class="text-muted">
                    Mark a facility unavailable for a selected date and time.
                </p>

            </div>



            <!-- FORM CARD -->
            <div class="card shadow-sm">

                <div class="card-body p-4">


                    <form th:action="@{/admin/blockouts}"
                          method="post">


                        <!-- FACILITY -->
                        <div class="mb-3">

                            <label class="form-label">
                                Sports Facility
                            </label>

                            <select name="facilityId"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select Facility
                                </option>

                                <option th:each="facility : ${facilities}"
                                        th:value="${facility.id}"
                                        th:text="${facility.name
                                                  + ' - '
                                                  + facility.type
                                                  + ' - '
                                                  + facility.location}">
                                </option>

                            </select>

                            <div class="form-text">
                                Only active facilities are shown.
                            </div>

                        </div>



                        <!-- TIME -->
                        <div class="row">


                            <!-- START -->
                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Start Date / Time
                                </label>

                                <input type="datetime-local"
                                       name="startDateTime"
                                       class="form-control"
                                       required>

                            </div>


                            <!-- END -->
                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    End Date / Time
                                </label>

                                <input type="datetime-local"
                                       name="endDateTime"
                                       class="form-control"
                                       required>

                            </div>


                        </div>



                        <!-- REASON -->
                        <div class="mb-4">

                            <label class="form-label">
                                Reason
                            </label>

                            <textarea name="reason"
                                      class="form-control"
                                      rows="4"
                                      maxlength="500"
                                      placeholder="Example: Maintenance work, cleaning, private event">
                            </textarea>

                            <div class="form-text">
                                Optional, but recommended for admin records.
                            </div>

                        </div>



                        <!-- INFORMATION -->
                        <div class="alert alert-info">

                            <strong>Important:</strong>

                            <br>

                            Users will not be allowed to make facility bookings
                            that overlap this block-out period.

                        </div>



                        <!-- BUTTONS -->
                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-primary">

                                Create Block-Out

                            </button>


                            <a th:href="@{/admin/blockouts}"
                               class="btn btn-outline-secondary">

                                Cancel

                            </a>

                        </div>


                    </form>


                </div>

            </div>


        </div>

    </div>


</div>



<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}">
</script>


</body>

</html>
