<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Fitness Classes - USP Fitness Club</title>


    <!-- Bootstrap -->

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">


    <!-- Our CSS -->

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

</head>


<body>


<!-- ADMIN NAVBAR -->

<div th:replace="~{fragments/admin-navbar :: adminNavbar}">
</div>



<div class="container page-container">


    <!-- PAGE HEADER -->

    <div class="d-flex
                justify-content-between
                align-items-center
                mb-4">


        <div>

            <h1 class="page-title">
                Fitness Classes
            </h1>

            <p class="text-muted mb-0">
                Manage scheduled fitness classes
            </p>

        </div>


        <a th:href="@{/fitness-classes/new}"
           class="btn btn-primary">

            + Add Fitness Class

        </a>


    </div>



    <!-- SUCCESS MESSAGE -->

    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">


        <span th:text="${successMessage}">
        </span>


        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>


    </div>



    <!-- ERROR MESSAGE -->

    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">


        <span th:text="${errorMessage}">
        </span>


        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>


    </div>



    <!-- CARD -->

    <div class="card shadow-sm">


        <div class="card-body">


            <!-- TABLE - ONLY IF CLASSES EXIST -->

            <div th:if="${!#lists.isEmpty(fitnessClasses)}"
                 class="table-responsive">


                <table class="table
                              table-striped
                              table-hover
                              align-middle">


                    <thead class="table-dark">


                    <tr>

                        <th>ID</th>

                        <th>Class</th>

                        <th>Date</th>

                        <th>Time</th>

                        <th>Trainer</th>

                        <th>Capacity</th>

                        <th>Actions</th>

                    </tr>


                    </thead>



                    <tbody>


                    <tr th:each="fitnessClass : ${fitnessClasses}">


                        <!-- ID -->

                        <td th:text="${fitnessClass.id}">
                        </td>



                        <!-- CLASS NAME -->

                        <td>

                            <strong th:text="${fitnessClass.name}">
                            </strong>

                        </td>



                        <!-- DATE -->

                        <td th:text="${fitnessClass.date}">
                        </td>



                        <!-- TIME -->

                        <td>


                            <span class="badge text-bg-success"
                                  th:text="${fitnessClass.startTime}">
                            </span>


                            <span class="mx-1">
                                -
                            </span>


                            <span class="badge text-bg-secondary"
                                  th:text="${fitnessClass.endTime}">
                            </span>


                        </td>



                        <!-- TRAINER -->

                        <td>


                            <span th:text="${fitnessClass.trainer.firstName}">
                            </span>


                            <span th:text="${fitnessClass.trainer.lastName}">
                            </span>


                        </td>



                        <!-- CAPACITY -->

                        <td>


                            <span class="badge text-bg-info"
                                  th:text="${fitnessClass.capacity}">
                            </span>


                        </td>



                        <!-- ACTIONS -->

                        <td>


                            <div class="d-flex gap-2">


                                <!-- EDIT -->

                                <a th:href="@{/fitness-classes/edit/{id}
                                           (id=${fitnessClass.id})}"
                                   class="btn
                                          btn-sm
                                          btn-outline-primary">

                                    Edit

                                </a>



                                <!-- DELETE -->

                                <form th:action="@{/fitness-classes/delete/{id}
                                                 (id=${fitnessClass.id})}"
                                      method="post">


                                    <button type="submit"
                                            class="btn
                                                   btn-sm
                                                   btn-outline-danger"

                                            onclick="return confirm(
                                            'Delete this fitness class?'
                                            );">

                                        Delete

                                    </button>


                                </form>


                            </div>


                        </td>


                    </tr>


                    </tbody>


                </table>


            </div>



            <!-- EMPTY MESSAGE - ONLY IF NO CLASSES -->

            <div th:if="${#lists.isEmpty(fitnessClasses)}"
                 class="text-center text-muted p-5">


                <h5>
                    No fitness classes found
                </h5>


                <p class="mb-3">

                    Create the first fitness class.

                </p>


                <a th:href="@{/fitness-classes/new}"
                   class="btn btn-primary">

                    + Add Fitness Class

                </a>


            </div>


        </div>


    </div>


</div>



<!-- BOOTSTRAP JAVASCRIPT -->

<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}">
</script>


</body>

</html>
