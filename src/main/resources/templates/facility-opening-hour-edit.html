<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Edit Opening Hours - USP Fitness Centre</title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

</head>


<body>


<div th:replace="~{fragments/admin-navbar :: adminNavbar}">
</div>


<div class="container page-container">


    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">


            <!-- HEADER -->
            <div class="mb-4">

                <h1 class="page-title">
                    Edit Opening Hours
                </h1>

                <h5 th:text="${facility.name}">
                    Facility Name
                </h5>

                <p class="text-muted">
                    Update the operating hours for this day.
                </p>

            </div>



            <!-- FORM -->
            <div class="card shadow-sm">

                <div class="card-body p-4">


                    <form th:action="@{/admin/facilities/{facilityId}/opening-hours/update/{hourId}
                                      (facilityId=${facility.id},
                                       hourId=${openingHour.id})}"
                          method="post">


                        <!-- DAY -->
                        <div class="mb-3">

                            <label class="form-label">
                                Day of Week
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:value="${openingHour.dayOfWeek}"
                                   readonly>

                        </div>



                        <!-- TIMES -->
                        <div class="row">


                            <!-- OPENING TIME -->
                            <div class="col-md-6 mb-3">

                                <label for="openingTime"
                                       class="form-label">

                                    Opening Time

                                </label>


                                <input type="time"
                                       id="openingTime"
                                       name="openingTime"
                                       class="form-control"
                                       th:value="${openingHour.openingTime}"
                                       required>

                            </div>



                            <!-- CLOSING TIME -->
                            <div class="col-md-6 mb-3">

                                <label for="closingTime"
                                       class="form-label">

                                    Closing Time

                                </label>


                                <input type="time"
                                       id="closingTime"
                                       name="closingTime"
                                       class="form-control"
                                       th:value="${openingHour.closingTime}"
                                       required>

                            </div>


                        </div>



                        <!-- INFO -->
                        <div class="alert alert-info">

                            Closing time must be later than
                            the opening time.

                        </div>



                        <!-- BUTTONS -->
                        <div class="d-flex gap-2">


                            <button type="submit"
                                    class="btn btn-primary">

                                Update Opening Hours

                            </button>


                            <a th:href="@{/admin/facilities/{facilityId}/opening-hours
                                         (facilityId=${facility.id})}"
                               class="btn btn-outline-secondary">

                                Cancel

                            </a>


                        </div>


                    </form>


                </div>

            </div>


        </div>

    </div>


</div>



<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}">
</script>


</body>

</html>
