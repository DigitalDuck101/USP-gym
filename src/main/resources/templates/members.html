<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">


    <title>Members - USP Fitness Club</title>


    <!-- Bootstrap -->

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">


    <!-- Our CSS -->

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

</head>


<body>


<!-- ADMIN NAVBAR -->

<div th:replace="~{fragments/admin-navbar :: adminNavbar}">
</div>



<div class="container page-container">


    <!-- PAGE HEADER -->

    <div class="d-flex
                justify-content-between
                align-items-center
                mb-4">


        <div>

            <h1 class="page-title">
                Members
            </h1>

            <p class="text-muted mb-0">
                Manage students and renters
            </p>

        </div>


        <a th:href="@{/members/new}"
           class="btn btn-primary">

            + Add Member

        </a>

    </div>



    <!-- SUCCESS MESSAGE -->

    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">


        <span th:text="${successMessage}">
        </span>


        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>



    <!-- ERROR MESSAGE -->

    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">


        <span th:text="${errorMessage}">
        </span>


        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>



    <!-- MEMBER TABLE CARD -->

    <div class="card shadow-sm">


        <div class="card-body">


            <div class="table-responsive">


                <table class="table
                              table-striped
                              table-hover
                              align-middle">


                    <thead class="table-dark">


                    <tr>

                        <th>ID</th>

                        <th>Type</th>

                        <th>Student ID</th>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Phone</th>

                        <th>Verification</th>

                        <th>Actions</th>

                    </tr>


                    </thead>



                    <tbody>


                    <tr th:each="member : ${members}">


                        <!-- ID -->

                        <td th:text="${member.id}">
                        </td>



                        <!-- MEMBER TYPE -->

                        <td>


                            <span th:if="${member.memberType != null
                                         and member.memberType.name()
                                         == 'STUDENT'}"
                                  class="badge text-bg-success">

                                STUDENT

                            </span>


                            <span th:if="${member.memberType != null
                                         and member.memberType.name()
                                         == 'RENTER'}"
                                  class="badge text-bg-primary">

                                RENTER

                            </span>


                        </td>



                        <!-- STUDENT ID -->

                        <td>


                            <span th:if="${member.studentId != null}"
                                  th:text="${member.studentId}">
                            </span>


                            <span th:if="${member.studentId == null}"
                                  class="text-muted">

                                —

                            </span>


                        </td>



                        <!-- NAME -->

                        <td>

                            <strong>

                                <span th:text="${member.firstName}">
                                </span>

                                <span th:text="${member.lastName}">
                                </span>

                            </strong>

                        </td>



                        <!-- EMAIL -->

                        <td th:text="${member.email}">
                        </td>



                        <!-- PHONE -->

                        <td>


                            <span th:if="${member.phone != null}"
                                  th:text="${member.phone}">
                            </span>


                            <span th:if="${member.phone == null}"
                                  class="text-muted">

                                —

                            </span>


                        </td>



                        <!-- VERIFICATION STATUS -->

                        <td>


                            <span th:if="${member.verificationStatus != null
                                         and member.verificationStatus.name()
                                         == 'APPROVED'}"
                                  class="badge text-bg-success">

                                APPROVED

                            </span>



                            <span th:if="${member.verificationStatus != null
                                         and member.verificationStatus.name()
                                         == 'PENDING'}"
                                  class="badge text-bg-warning">

                                PENDING

                            </span>



                            <span th:if="${member.verificationStatus != null
                                         and member.verificationStatus.name()
                                         == 'REJECTED'}"
                                  class="badge text-bg-danger">

                                REJECTED

                            </span>



                            <span th:if="${member.verificationStatus != null
                                         and member.verificationStatus.name()
                                         == 'NOT_REQUIRED'}"
                                  class="badge text-bg-secondary">

                                NOT REQUIRED

                            </span>


                        </td>



                        <!-- ACTIONS -->

                        <td>


                            <div class="d-flex gap-2">


                                <!-- EDIT -->

                                <a th:href="@{/members/edit/{id}
                                   (id=${member.id})}"
                                   class="btn
                                          btn-sm
                                          btn-outline-primary">

                                    Edit

                                </a>



                                <!-- DELETE -->

                                <form th:action="@{/members/delete/{id}
                                        (id=${member.id})}"
                                      method="post">


                                    <button type="submit"
                                            class="btn
                                                   btn-sm
                                                   btn-outline-danger"

                                            onclick="
                                            return confirm(
                                            'Delete this member?'
                                            );">

                                        Delete

                                    </button>


                                </form>


                            </div>


                        </td>


                    </tr>


                    </tbody>


                </table>


            </div>



            <!-- EMPTY TABLE -->

            <div th:if="${#lists.isEmpty(members)}"
                 class="text-center text-muted p-5">


                <h5>No members found</h5>

                <p>
                    Add the first student or renter.
                </p>


            </div>


        </div>

    </div>


</div>



<!-- Bootstrap JavaScript -->

<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}">
</script>


</body>

</html>
