<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>USP Fitness Club - Registration</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border: 1px solid #ddd;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
        }

        .error {
            color: red;
        }

    </style>

</head>


<body>


<div class="container">


<h1>USP Fitness Club</h1>

<h2>Create Account</h2>


<p th:if="${errorMessage}"
   th:text="${errorMessage}"
   class="error">
</p>


<form th:action="@{/register}"
      th:object="${member}"
      method="post">


    <label>Member Type:</label>

    <select th:field="*{memberType}"
            id="memberType"
            onchange="updateStudentId()"
            required>

        <option value="">
            Select Member Type
        </option>

        <option value="STUDENT">
            Student
        </option>

        <option value="RENTER">
            Renter
        </option>

    </select>


    <div id="studentIdSection">

        <label>Student ID:</label>

        <input type="text"
               th:field="*{studentId}"
               id="studentId">

    </div>


    <label>First Name:</label>

    <input type="text"
           th:field="*{firstName}"
           required>


    <label>Last Name:</label>

    <input type="text"
           th:field="*{lastName}"
           required>


    <label>Email:</label>

    <input type="email"
           th:field="*{email}"
           required>


    <label>Phone:</label>

    <input type="text"
           th:field="*{phone}">


    <label>Username:</label>

    <input type="text"
           name="username"
           required>


    <label>Password:</label>

    <input type="password"
           name="password"
           required>


    <button type="submit">
        Register
    </button>


</form>


<br>

<a th:href="@{/login}">
    Back to Login
</a>


</div>


<script>

function updateStudentId() {

    const type =
        document.getElementById("memberType").value;

    const section =
        document.getElementById("studentIdSection");

    const input =
        document.getElementById("studentId");


    if (type === "STUDENT") {

        section.style.display = "block";

        input.required = true;

    } else {

        section.style.display = "none";

        input.required = false;

        input.value = "";
    }
}


updateStudentId();

</script>


</body>

</html>
