<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Create Facility Rental - USP Fitness Club</title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

</head>


<body>


<!-- ADMIN NAVBAR -->

<div th:replace="~{fragments/admin-navbar :: adminNavbar}">
</div>


<div class="container page-container">


    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">


            <div class="mb-4">

                <h1 class="page-title">
                    Create Facility Rental
                </h1>

                <p class="text-muted">
                    Create a confirmed facility rental for a renter
                </p>

            </div>


            <div class="card shadow-sm">

                <div class="card-body p-4">


                    <form th:action="@{/admin/rentals}"
                          method="post">


                        <!-- RENTER -->

                        <div class="mb-3">

                            <label class="form-label">
                                Renter
                            </label>


                            <select name="renterId"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select Renter
                                </option>


                                <option th:each="renter : ${renters}"
                                        th:value="${renter.id}"
                                        th:text="${renter.firstName
                                                  + ' '
                                                  + renter.lastName
                                                  + ' - '
                                                  + renter.email}">
                                </option>

                            </select>

                        </div>


                        <!-- SPORTS FACILITY -->

                        <div class="mb-3">

                            <label class="form-label">
                                Sports Facility
                            </label>


                            <select name="facilityId"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select Facility
                                </option>


                                <option th:each="facility : ${facilities}"
                                        th:value="${facility.id}"
                                        th:text="${facility.name
                                                  + ' - '
                                                  + facility.type
                                                  + ' - '
                                                  + facility.location}">
                                </option>

                            </select>

                        </div>


                        <!-- START / END -->

                        <div class="row">


                            <!-- START -->

                            <div class="col-md-6 mb-3">

                                <label for="startDateTime"
                                       class="form-label">

                                    Start Date / Time

                                </label>


                                <input type="datetime-local"
                                       name="startDateTime"
                                       id="startDateTime"
                                       class="form-control"
                                       required>

                            </div>


                            <!-- END -->

                            <div class="col-md-6 mb-3">

                                <label for="endDateTime"
                                       class="form-label">

                                    End Date / Time

                                </label>


                                <input type="datetime-local"
                                       name="endDateTime"
                                       id="endDateTime"
                                       class="form-control"
                                       required>

                            </div>


                        </div>


                        <!-- PURPOSE -->

                        <div class="mb-4">

                            <label for="purpose"
                                   class="form-label">

                                Purpose

                            </label>


                            <textarea name="purpose"
                                      id="purpose"
                                      class="form-control"
                                      rows="5"
                                      placeholder="Example: Football training session"
                                      required>
                            </textarea>

                        </div>


                        <div class="alert alert-info">

                            Past dates and times cannot be selected.

                        </div>


                        <!-- BUTTONS -->

                        <div class="d-flex gap-2">


                            <button type="submit"
                                    class="btn btn-primary">

                                Create Rental

                            </button>


                            <a th:href="@{/admin/rentals}"
                               class="btn btn-outline-secondary">

                                Cancel

                            </a>


                        </div>


                    </form>


                </div>

            </div>


        </div>

    </div>


</div>


<!-- ============================================= -->
<!-- DATE / TIME VALIDATION -->
<!-- ============================================= -->

<script>

    function getLocalDateTime() {

        const now = new Date();

        const year =
                now.getFullYear();

        const month =
                String(now.getMonth() + 1)
                        .padStart(2, "0");

        const day =
                String(now.getDate())
                        .padStart(2, "0");

        const hours =
                String(now.getHours())
                        .padStart(2, "0");

        const minutes =
                String(now.getMinutes())
                        .padStart(2, "0");


        return year
                + "-"
                + month
                + "-"
                + day
                + "T"
                + hours
                + ":"
                + minutes;
    }


    const startInput =
            document.getElementById(
                    "startDateTime"
            );

    const endInput =
            document.getElementById(
                    "endDateTime"
            );


    /*
     * Current local date/time.
     */

    const now =
            getLocalDateTime();


    /*
     * Prevent selection of past date/time.
     */

    startInput.min = now;

    endInput.min = now;


    /*
     * When Start changes,
     * End cannot be earlier than Start.
     */

    startInput.addEventListener(
            "change",
            function () {


                endInput.min =
                        startInput.value;


                /*
                 * If an invalid End was already selected,
                 * remove it.
                 */

                if (endInput.value
                        && endInput.value
                        <= startInput.value) {

                    endInput.value = "";
                }

            }
    );


    /*
     * Additional browser-side check.
     */

    endInput.addEventListener(
            "change",
            function () {


                if (startInput.value
                        && endInput.value
                        <= startInput.value) {


                    alert(
                            "End date/time must be after start date/time."
                    );


                    endInput.value = "";

                }

            }
    );

</script>


<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}">
</script>


</body>

</html>
