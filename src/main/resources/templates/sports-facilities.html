<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Sports Facilities - USP Fitness Club</title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

</head>


<body>


<div th:replace="~{fragments/admin-navbar :: adminNavbar}">
</div>


<div class="container page-container">


    <!-- HEADER -->

    <div class="d-flex
                justify-content-between
                align-items-center
                mb-4">


        <div>

            <h1 class="page-title">
                Sports Facilities
            </h1>

            <p class="text-muted mb-0">
                Manage university sports facilities
            </p>

        </div>


        <a th:href="@{/admin/facilities/new}"
           class="btn btn-primary">

            + Add Facility

        </a>

    </div>



    <!-- SUCCESS -->

    <div th:if="${successMessage}"
         class="alert alert-success
                alert-dismissible fade show">

        <span th:text="${successMessage}">
        </span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>



    <!-- ERROR -->

    <div th:if="${errorMessage}"
         class="alert alert-danger
                alert-dismissible fade show">

        <span th:text="${errorMessage}">
        </span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>



    <!-- CARD -->

    <div class="card shadow-sm">

        <div class="card-body">


            <!-- TABLE -->

            <div th:if="${!#lists.isEmpty(facilities)}"
                 class="table-responsive">


                <table class="table
                              table-striped
                              table-hover
                              align-middle">


                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Type</th>

                        <th>Location</th>

                        <th>Description</th>

                        <th>Status</th>

                        <th>Actions</th>

                    </tr>

                    </thead>



                    <tbody>


                    <tr th:each="facility : ${facilities}">


                        <!-- ID -->

                        <td th:text="${facility.id}">
                        </td>



                        <!-- NAME -->

                        <td>

                            <strong th:text="${facility.name}">
                            </strong>

                        </td>



                        <!-- TYPE -->

                        <td>

                            <span class="badge text-bg-info"
                                  th:text="${facility.type}">
                            </span>

                        </td>



                        <!-- LOCATION -->

                        <td>

                            <span th:if="${facility.location != null
                                         and !facility.location.isEmpty()}"
                                  th:text="${facility.location}">
                            </span>


                            <span th:unless="${facility.location != null
                                             and !facility.location.isEmpty()}"
                                  class="text-muted">

                                —

                            </span>

                        </td>



                        <!-- DESCRIPTION -->

                        <td>

                            <span th:if="${facility.description != null
                                         and !facility.description.isEmpty()}"
                                  th:text="${facility.description}">
                            </span>


                            <span th:unless="${facility.description != null
                                             and !facility.description.isEmpty()}"
                                  class="text-muted">

                                —

                            </span>

                        </td>



                        <!-- STATUS -->

                        <td>


                            <span th:if="${facility.active}"
                                  class="badge text-bg-success">

                                ACTIVE

                            </span>


                            <span th:unless="${facility.active}"
                                  class="badge text-bg-danger">

                                INACTIVE

                            </span>


                        </td>



                        <!-- ACTIONS -->

                        <td>


                            <div class="d-flex gap-2 flex-wrap">


                                <!-- EDIT -->

                                <a th:href="@{/admin/facilities/edit/{id}
                                           (id=${facility.id})}"
                                   class="btn btn-sm
                                          btn-outline-primary">

                                    Edit

                                </a>



                                <!-- ACTIVATE / DEACTIVATE -->

                                <form th:action="@{/admin/facilities/toggle/{id}
                                                 (id=${facility.id})}"
                                      method="post">


                                    <button th:if="${facility.active}"
                                            type="submit"
                                            class="btn btn-sm
                                                   btn-outline-danger">

                                        Deactivate

                                    </button>


                                    <button th:unless="${facility.active}"
                                            type="submit"
                                            class="btn btn-sm
                                                   btn-outline-success">

                                        Activate

                                    </button>


                                </form>


                            </div>


                        </td>


                    </tr>


                    </tbody>

                </table>

            </div>



            <!-- EMPTY -->

            <div th:if="${#lists.isEmpty(facilities)}"
                 class="text-center text-muted p-5">

                <h5>
                    No sports facilities found
                </h5>

                <p>
                    Add the first university sports facility.
                </p>

                <a th:href="@{/admin/facilities/new}"
                   class="btn btn-primary">

                    + Add Facility

                </a>

            </div>


        </div>

    </div>


</div>


<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}">
</script>


</body>
</html>
