<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Add Fitness Class - USP Fitness Club</title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/app.css}">
</head>

<body>

<div th:replace="~{fragments/admin-navbar :: adminNavbar}">
</div>


<div class="container page-container">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">

            <div class="mb-4">

                <h1 class="page-title">
                    Add Fitness Class
                </h1>

                <p class="text-muted">
                    Schedule a new fitness class
                </p>

            </div>


            <div class="card shadow-sm">

                <div class="card-body p-4">


                    <form th:action="@{/fitness-classes}"
                          th:object="${fitnessClass}"
                          method="post">


                        <!-- CLASS NAME -->

                        <div class="mb-3">

                            <label class="form-label">
                                Class Name
                            </label>

                            <input type="text"
                                   th:field="*{name}"
                                   class="form-control"
                                   placeholder="Example: Yoga"
                                   required>

                        </div>


                        <!-- TRAINER -->

                        <div class="mb-3">

                            <label class="form-label">
                                Trainer
                            </label>

                            <select name="trainerId"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select Trainer
                                </option>

                                <option th:each="trainer : ${trainers}"
                                        th:value="${trainer.id}"
                                        th:text="${trainer.firstName
                                                  + ' '
                                                  + trainer.lastName
                                                  + ' - '
                                                  + trainer.specialization}">
                                </option>

                            </select>

                        </div>


                        <!-- DATE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Date
                            </label>

                            <input type="date"
                                   th:field="*{date}"
                                   class="form-control"
                                   required>

                        </div>


                        <div class="row">


                            <!-- START TIME -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Start Time
                                </label>

                                <input type="time"
                                       th:field="*{startTime}"
                                       class="form-control"
                                       required>

                            </div>


                            <!-- END TIME -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    End Time
                                </label>

                                <input type="time"
                                       th:field="*{endTime}"
                                       class="form-control"
                                       required>

                            </div>

                        </div>


                        <!-- CAPACITY -->

                        <div class="mb-4">

                            <label class="form-label">
                                Capacity
                            </label>

                            <input type="number"
                                   th:field="*{capacity}"
                                   class="form-control"
                                   min="1"
                                   required>

                            <div class="form-text">
                                Maximum number of members allowed.
                            </div>

                        </div>


                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-primary">

                                Create Fitness Class
                            </button>


                            <a th:href="@{/fitness-classes}"
                               class="btn btn-outline-secondary">

                                Cancel
                            </a>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}">
</script>

</body>
</html>
