<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Facility Block-Outs - USP Fitness Centre</title>


    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

</head>


<body>


<!-- ADMIN NAVBAR -->
<div th:replace="~{fragments/admin-navbar :: adminNavbar}">
</div>


<div class="container page-container">


    <!-- ============================================= -->
    <!-- HEADER -->
    <!-- ============================================= -->

    <div class="d-flex
                justify-content-between
                align-items-center
                flex-wrap
                gap-3
                mb-4">

        <div>

            <h1 class="page-title">
                Facility Block-Out Periods
            </h1>

            <p class="text-muted mb-0">
                Mark facilities unavailable for maintenance,
                events, cleaning or other reasons.
            </p>

        </div>


        <a th:href="@{/admin/blockouts/new}"
           class="btn btn-primary">

            + Create Block-Out

        </a>

    </div>



    <!-- ============================================= -->
    <!-- SUCCESS MESSAGE -->
    <!-- ============================================= -->

    <div th:if="${successMessage}"
         class="alert alert-success
                alert-dismissible
                fade show">

        <span th:text="${successMessage}">
        </span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>



    <!-- ============================================= -->
    <!-- ERROR MESSAGE -->
    <!-- ============================================= -->

    <div th:if="${errorMessage}"
         class="alert alert-danger
                alert-dismissible
                fade show">

        <span th:text="${errorMessage}">
        </span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>



    <!-- ============================================= -->
    <!-- BLOCK-OUT TABLE -->
    <!-- ============================================= -->

    <div class="card shadow-sm">

        <div class="card-body">


            <div th:if="${!#lists.isEmpty(blockouts)}"
                 class="table-responsive">


                <table class="table
                              table-striped
                              table-hover
                              align-middle">


                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>Facility</th>

                        <th>Location</th>

                        <th>Start</th>

                        <th>End</th>

                        <th>Reason</th>

                        <th>Action</th>

                    </tr>

                    </thead>



                    <tbody>


                    <tr th:each="blockout : ${blockouts}">


                        <!-- ID -->
                        <td th:text="${blockout.id}">
                        </td>


                        <!-- FACILITY -->
                        <td>

                            <strong th:text="${blockout.facility.name}">
                            </strong>

                            <div class="small text-muted"
                                 th:text="${blockout.facility.type}">
                            </div>

                        </td>


                        <!-- LOCATION -->
                        <td th:text="${blockout.facility.location}">
                        </td>


                        <!-- START -->
                        <td th:text="${#temporals.format(
                                blockout.startDateTime,
                                'dd MMM yyyy hh:mm a'
                                )}">
                        </td>


                        <!-- END -->
                        <td th:text="${#temporals.format(
                                blockout.endDateTime,
                                'dd MMM yyyy hh:mm a'
                                )}">
                        </td>


                        <!-- REASON -->
                        <td>

                            <span th:if="${blockout.reason != null
                                         and !blockout.reason.isBlank()}"
                                  th:text="${blockout.reason}">
                            </span>

                            <span th:unless="${blockout.reason != null
                                             and !blockout.reason.isBlank()}"
                                  class="text-muted">
                                —
                            </span>

                        </td>


                        <!-- DELETE -->
                        <td>

                            <form th:action="@{/admin/blockouts/delete/{id}
                                   (id=${blockout.id})}"
                                  method="post">

                                <button type="submit"
                                        class="btn
                                               btn-sm
                                               btn-outline-danger"
                                        onclick="
                                        return confirm(
                                        'Remove this block-out period?'
                                        );">

                                    Remove

                                </button>

                            </form>

                        </td>


                    </tr>


                    </tbody>

                </table>

            </div>



            <!-- ===================================== -->
            <!-- EMPTY STATE -->
            <!-- ===================================== -->

            <div th:if="${#lists.isEmpty(blockouts)}"
                 class="text-center
                        text-muted
                        p-5">

                <h5>
                    No block-out periods
                </h5>

                <p class="mb-3">
                    No facilities are currently blocked.
                </p>

                <a th:href="@{/admin/blockouts/new}"
                   class="btn btn-primary">

                    Create First Block-Out

                </a>

            </div>


        </div>

    </div>


</div>



<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}">
</script>


</body>

</html>
