<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Administrators - USP Fitness Club
    </title>


    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

</head>


<body>


<div th:replace="~{fragments/admin-navbar :: adminNavbar}">
</div>



<div class="container page-container">


    <div class="d-flex
                justify-content-between
                align-items-center
                mb-4">


        <div>

            <h1 class="page-title">
                Administrators
            </h1>

            <p class="text-muted mb-0">

                Manage administrator accounts

            </p>

        </div>


        <a th:href="@{/admin/admins/new}"
           class="btn btn-primary">

            + New Administrator

        </a>


    </div>



    <!-- SUCCESS -->

    <div th:if="${successMessage}"
         class="alert alert-success">

        <span th:text="${successMessage}">
        </span>

    </div>



    <!-- ERROR -->

    <div th:if="${errorMessage}"
         class="alert alert-danger">

        <span th:text="${errorMessage}">
        </span>

    </div>



    <div class="card shadow-sm">

        <div class="card-body p-0">


            <div class="table-responsive">


                <table class="table
                              table-striped
                              table-hover
                              align-middle
                              mb-0">


                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>Username</th>

                        <th>Role</th>

                        <th>Status</th>

                        <th>Actions</th>

                    </tr>

                    </thead>



                    <tbody>


                    <tr th:each="admin : ${admins}">


                        <td th:text="${admin.id}">
                        </td>


                        <td>

                            <strong th:text="${admin.username}">
                            </strong>


                            <span th:if="${admin.username == currentUsername}"
                                  class="badge text-bg-primary ms-2">

                                YOU

                            </span>

                        </td>


                        <td>

                            <span class="badge text-bg-dark">

                                ADMIN

                            </span>

                        </td>


                        <td>


                            <span th:if="${admin.enabled}"
                                  class="badge text-bg-success">

                                ENABLED

                            </span>


                            <span th:unless="${admin.enabled}"
                                  class="badge text-bg-secondary">

                                DISABLED

                            </span>


                        </td>


                        <td>


                            <div class="d-flex
                                        gap-2
                                        flex-wrap">


                                <!-- VIEW -->

                                <a th:href="@{/admin/admins/{id}
                                           (id=${admin.id})}"
                                   class="btn
                                          btn-sm
                                          btn-outline-primary">

                                    View

                                </a>



                                <!-- EDIT -->

                                <a th:href="@{/admin/admins/edit/{id}
                                           (id=${admin.id})}"
                                   class="btn
                                          btn-sm
                                          btn-outline-secondary">

                                    Edit

                                </a>



                                <!-- DELETE -->

                                <form th:if="${admin.username != currentUsername}"
                                      th:action="@{/admin/admins/delete/{id}
                                                 (id=${admin.id})}"
                                      method="post">


                                    <button type="submit"
                                            class="btn
                                                   btn-sm
                                                   btn-outline-danger"
                                            onclick="return confirm(
                                            'Delete this administrator?'
                                            );">

                                        Delete

                                    </button>


                                </form>


                                <span th:if="${admin.username == currentUsername}"
                                      class="text-muted small
                                             align-self-center">

                                    Cannot delete yourself

                                </span>


                            </div>


                        </td>


                    </tr>


                    </tbody>


                </table>


            </div>


        </div>

    </div>


</div>



<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}">
</script>


</body>

</html>
